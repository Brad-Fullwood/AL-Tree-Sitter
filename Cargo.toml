[package]
name = "tree-sitter-al"
description = "AL (Microsoft Dynamics 365 Business Central) grammar for the tree-sitter parsing library"
version = "0.1.0"
license = "MIT"
readme = "README.md"
keywords = ["incremental", "parsing", "tree-sitter", "al", "business-central"]
categories = ["parsing", "text-editors"]
repository = "https://github.com/Brad-Fullwood/AL-Tree-Sitter"
edition = "2021"
autoexamples = false

# Canonical tree-sitter Rust binding layout: the generated C parser lives in
# `src/`, the Rust binding in `bindings/rust/`. `include` keeps the published
# crate tarball self-contained (no external paths), which is what lets
# downstream crates such as `al-syntax` be published to crates.io.
build = "bindings/rust/build.rs"
include = [
    "bindings/rust/*",
    "data/*",
    "grammar.js",
    "queries/*",
    "src/*",
    "tree-sitter.json",
    "LICENSE",
    "README.md",
]

[lib]
path = "bindings/rust/lib.rs"

[dependencies]
tree-sitter-language = "0.1"

[build-dependencies]
cc = "1.0"

[dev-dependencies]
tree-sitter = "0.25"
