name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  grammar:
    name: Grammar, generator, and pinned corpus
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install pinned tree-sitter CLI
        run: cargo install tree-sitter-cli --version "$(cat .tree-sitter-cli-version)" --locked

      - name: ShellCheck repository scripts
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          shellcheck tests/*.sh

      - name: Check formatting
        run: |
          cargo fmt --all -- --check
          cargo fmt --manifest-path generator/Cargo.toml -- --check

      - name: Lint grammar and generator
        run: |
          cargo clippy --all-targets -- -D warnings
          cargo clippy --manifest-path generator/Cargo.toml --all-targets -- -D warnings

      - name: Test grammar and generator
        run: |
          cargo test --all-targets
          cargo test --manifest-path generator/Cargo.toml --all-targets

      - name: Run grammar corpus tests
        run: tree-sitter test

      - name: Validate focused fixtures and pinned repositories
        run: tests/run_repo_tests.sh

      - name: Validate publishable package contents
        run: cargo package --list

      - name: Require repository cleanliness
        run: git diff --exit-code
